<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Çalışma Şablonu</title>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <link rel="stylesheet" href="style.css">
<!--EXTRA_CSS-->
</head>
<body>

    <!-- Hamburger (mobil) -->
    <button class="hamburger" onclick="toggleSidebar()" aria-label="Menü">&#9776;</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="layout">

        <nav class="sidebar">
            <div class="sidebar-header">
                <button type="button" class="sidebar-daralt" onclick="toggleSidebar()"
                        aria-label="Menuyu gizle" title="Menuyu gizle  ( [ )">&#10094;</button>
                <div class="sidebar-baslik-metin">
                    <h2><!--SIDEBAR_BASLIK--></h2>
                    <p><!--SIDEBAR_ALTBASLIK--></p>
                </div>
                <img class="sidebar-pp" src="profil.jpg" alt="Profil resmi"
                     width="46" height="46" onclick="ppBuyut()"
                     title="Buyutmek icin tikla">
            </div>

            <div class="arama-sar">
                <div class="arama-satir">
                    <input type="search" id="arama-kutu" class="arama-kutu"
                           placeholder="Ara&hellip;  (konu, formul, y''-6y')"
                           autocomplete="off" spellcheck="false"
                           aria-label="Sitede ara">
                    <button type="button" class="arama-temizle" id="arama-temizle"
                            aria-label="Aramayi temizle" hidden>&times;</button>
                </div>
                <div class="arama-palet" id="arama-palet" aria-label="Matematik kisayollari">
                    <button type="button" data-ek="y'">y&prime;</button>
                    <button type="button" data-ek="y''">y&Prime;</button>
                    <button type="button" data-ek="dy/dx">dy/dx</button>
                    <button type="button" data-ek="L{">&#8466;{&nbsp;}</button>
                    <button type="button" data-ek="^">x&#8319;</button>
                    <button type="button" data-ek="sqrt">&radic;</button>
                    <button type="button" data-ek="int">&int;</button>
                    <button type="button" data-ek="sum">&Sigma;</button>
                    <button type="button" data-ek="infty">&infin;</button>
                    <button type="button" data-ek="pi">&pi;</button>
                    <button type="button" data-ek="alpha">&alpha;</button>
                    <button type="button" data-ek="lambda">&lambda;</button>
                </div>
                <p class="arama-ipucu" id="arama-ipucu"></p>
            </div>

            <div class="sidebar-nav">
                <div id="arama-sonuc" class="arama-sonuc" hidden></div>
<!--SIDEBAR-->
            </div>
        </nav>

        <div class="main-wrapper">
            <header>
                <div class="header-inner" style="display: flex; justify-content: space-between; align-items: center; max-width: 880px; margin: 0 auto; width: 100%;">
                    <div style="text-align: left;">
                        <h1><!--BASLIK--></h1>
                        <p><!--ALTBASLIK--></p>
                    </div>
                    <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleDarkMode()" aria-label="Gece Modu">
                        <span id="theme-icon">🌙</span> <span id="theme-text">Gece Modu</span>
                    </button>
                </div>
            </header>

            <main>
                <div id="content-area">
<!--ICERIK-->
                </div>
            </main>

            <footer>
                <!--FOOTER-->
            </footer>
        </div>
    </div>

<!--EXTRA_JS-->
    <!-- Profil resmi buyutme katmani -->
    <div class="pp-buyut" id="pp-buyut" onclick="ppKapat()"
         role="dialog" aria-modal="true" aria-label="Profil resmi">
        <figure class="pp-buyut-ic">
            <img src="profil.jpg" alt="Profil resmi">
            <figcaption>işimi seviyorum</figcaption>
        </figure>
        <button type="button" class="pp-kapat" aria-label="Kapat">&times;</button>
    </div>

<!--ARAMA_JS-->
    <script src="app.js"></script>
    <script src="arama-ui.js"></script>
</body>
</html>
