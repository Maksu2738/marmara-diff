<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e0c14" media="(prefers-color-scheme: dark)">
    <title>Ders Çalışma Şablonu</title>

    <!-- Tema, ilk boyamadan önce uygulanır — açılışta beyaz parlama olmasın -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                var dark = t === 'dark' || (!t && window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('pre-dark');
            } catch (e) {}
        })();
    </script>
    <style>html.pre-dark { background: #0d0c13; }</style>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\\\(', right: '\\\\)', display: false},
                {left: '\\\\[', right: '\\\\]', display: true}
            ]
        });"></script>

    <link rel="stylesheet" href="style.css">
<!--EXTRA_CSS-->
</head>
<body>

    <div class="sidebar-overlay"></div>

    <div class="layout">

        <nav class="sidebar" aria-label="Bölümler">
            <div class="sidebar-header">
                <h2><!--SIDEBAR_BASLIK--></h2>
                <p><!--SIDEBAR_ALTBASLIK--></p>
            </div>

            <div class="sidebar-nav">
<!--SIDEBAR-->
            </div>
        </nav>

        <div class="main-wrapper">

            <div class="topbar">
                <div class="topbar-inner">
                    <button class="hamburger" onclick="toggleSidebar()" aria-label="Menü" aria-expanded="false">&#9776;</button>
                    <span class="topbar-title"><!--BASLIK--></span>
                    <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleDarkMode()" aria-label="Gece modunu aç/kapat">
                        <span id="theme-icon">🌙</span> <span id="theme-text">Gece Modu</span>
                    </button>
                </div>
            </div>

            <header class="hero">
                <h1><!--BASLIK--></h1>
                <p><!--ALTBASLIK--></p>
            </header>

            <main>
                <div id="content-area">
<!--ICERIK-->
                </div>
            </main>

            <footer>
                <!--FOOTER-->
            </footer>
        </div>
    </div>

<!--EXTRA_JS-->
    <script src="app.js"></script>
</body>
</html>
